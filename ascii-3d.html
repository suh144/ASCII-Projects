<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ASCII Code Effect - WebGL</title>
    <style>
        body {
            margin: 0;
            background-color: #030712;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #38bdf8;
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* The container where Three.js injects the ASCII text table */
        #ascii-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="info">Interactive 3D ASCII Shader - Move Mouse</div>
    <div id="ascii-container"></div>

    <!-- Import Three.js and the AsciiEffect module via ES modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let camera, scene, renderer, effect;
        let mesh;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        const startTimestamp = Date.now();

        init();
        animate();

        function init() {
            // 1. Camera setup
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 150;
            camera.position.z = 500;

            // 2. Scene setup with dynamic lighting
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030712);

            const pointLight1 = new THREE.PointLight(0x38bdf8, 3, 500);
            pointLight1.position.set(200, 200, 200);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xf43f5e, 3, 500);
            pointLight2.position.set(-200, -200, -200);
            scene.add(pointLight2);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            // 3. Create a complex 3D shape (Torus Knot)
            const geometry = new THREE.TorusKnotGeometry(120, 35, 120, 20);
            const material = new THREE.MeshStandardMaterial({ 
                roughness: 0.3, 
                metalness: 0.8 
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // 4. Standard WebGL Renderer
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 5. ASCII Effect Wrapper (converts WebGL canvas into styled text elements)
            // Characters density ramp: from dark to bright
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = '#38bdf8';
            effect.domElement.style.backgroundColor = '#030712';

            document.getElementById('ascii-container').appendChild(effect.domElement);

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onDocumentMouseMove);
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.5;
            mouseY = (event.clientY - windowHalfY) * 0.5;
        }

        function animate() {
            requestAnimationFrame(animate);

            const timer = Date.now() - startTimestamp;

            // Smooth rotation and organic floating animation
            mesh.position.y = Math.sin(timer * 0.002) * 40;
            mesh.rotation.x += 0.005;
            mesh.rotation.y += 0.008;

            // Camera parallax based on mouse movement
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY + 150 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            effect.render(scene, camera);
        }
    </script>
</body>
</html>
