<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Matrix Wireframe Terrain</title>
    <style>
        body {
            margin: 0;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #4ade80;
            font-size: 14px;
            letter-spacing: 3px;
            pointer-events: none;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.7);
            z-index: 10;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="info">Matrix Cyber-Terrain // 3D Wireframe Grid</div>
    <div id="canvas-container"></div>

    <!-- Import Three.js via ES modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, terrainMesh;
        let clock = new THREE.Clock();

        init();
        animate();

        function init() {
            // 1. Scene setup with deep dark-green fog for depth
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.003);

            // 2. Camera setup positioned looking across the plane
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 40, 250);
            camera.lookAt(0, 0, 0);

            // 3. Create the 3D Wireframe Terrain Geometry
            // A large plane divided into high-density segments for smooth wave displacement
            const geometry = new THREE.PlaneGeometry(600, 600, 50, 50);
            geometry.rotateX(-Math.PI / 2); // Lay it flat on the XZ plane

            // Store original Y positions to compute organic wave heights later
            const positionAttribute = geometry.attributes.position;
            const initialZ = [];
            for (let i = 0; i < positionAttribute.count; i++) {
                initialZ.push(positionAttribute.getY(i));
            }

            // 4. Neon Matrix Wireframe Material
            const material = new THREE.MeshBasicMaterial({
                color: 0x4ade80,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            scene.add(terrainMesh);

            // Add a glowing central horizon grid helper for extra cyber aesthetic
            const gridHelper = new THREE.GridHelper(1000, 50, 0x22c55e, 0x065f46);
            gridHelper.position.y = -10;
            scene.add(gridHelper);

            // 5. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Animate terrain vertices using sine waves to simulate digital fluid terrain
            const positionAttribute = terrainMesh.geometry.attributes.position;
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = positionAttribute.getX(i);
                const z = positionAttribute.getZ(i);
                
                // Combine multiple sine frequencies for organic wave interference
                const waveY = Math.sin(x * 0.02 + elapsedTime * 2.0) * Math.cos(z * 0.02 + elapsedTime * 1.5) * 15.0 
                            + Math.sin(x * 0.05 - elapsedTime) * 5.0;
                
                positionAttribute.setY(i, waveY);
            }
            positionAttribute.needsUpdate = true;

            // Slow forward camera drift to create a flying sensation
            camera.position.z = 250 - (elapsedTime * 15) % 200;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
